name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: true
      - name: Verify
        run: |
          go vet ./...
          go test ./... -count=1
      - name: Build archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/prism ./cmd/prism-cli
          tar -C dist -czf "dist/prism-${GITHUB_REF_NAME}-linux-amd64.tar.gz" prism
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -o dist/prism ./cmd/prism-cli
          tar -C dist -czf "dist/prism-${GITHUB_REF_NAME}-darwin-arm64.tar.gz" prism
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o dist/prism.exe ./cmd/prism-cli
          (cd dist && zip "prism-${GITHUB_REF_NAME}-windows-amd64.zip" prism.exe)
          rm -f dist/prism dist/prism.exe
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
