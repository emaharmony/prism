version: '3.8'

services:
  prism:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./runs:/app/runs
      - ./policies:/app/policies
    environment:
      - PRISM_PORT=8080
      - PRISM_RUN_DIR=/app/runs
      - PRISM_POLICY_DIR=/app/policies
    # For embedded NATS (no external NATS needed):
    # command: ["dashboard", "--embedded-bus"]
    command: ["dashboard"]