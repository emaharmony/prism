<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prism Dashboard</title>
<link rel="stylesheet" href="/app.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0f; color: #e0e0e8; }
  .header { background: #12121a; border-bottom: 1px solid #2a2a3a; padding: 16px 24px; display: flex; align-items: center; gap: 16px; }
  .header h1 { font-size: 20px; color: #a78bfa; }
  .header .version { font-size: 12px; color: #666; }
  .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
  .runs-grid { display: grid; gap: 12px; }
  .run-card { background: #16161f; border: 1px solid #2a2a3a; border-radius: 8px; padding: 16px; cursor: pointer; transition: border-color 0.2s; }
  .run-card:hover { border-color: #a78bfa; }
  .run-card .run-id { font-family: monospace; font-size: 14px; color: #a78bfa; margin-bottom: 8px; }
  .run-card .run-status { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
  .run-card .run-status.completed { background: #064e3b; color: #6ee7b7; }
  .run-card .run-status.running { background: #1e3a5f; color: #93c5fd; }
  .run-card .run-status.failed { background: #7f1d1d; color: #fca5a5; }
  .run-card .run-status.created { background: #3b3b0a; color: #fde68a; }
  .run-card .run-status.unknown { background: #333; color: #999; }
  .run-card .run-meta { margin-top: 8px; font-size: 13px; color: #888; }
  .run-card .task { font-size: 14px; color: #ccc; margin-top: 4px; }
  .detail { display: none; }
  .detail.active { display: block; }
  .detail-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .detail-header .back { color: #a78bfa; cursor: pointer; font-size: 14px; }
  .detail-header .back:hover { text-decoration: underline; }
  .detail-header h2 { font-size: 18px; }
  .tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid #2a2a3a; }
  .tab { padding: 8px 16px; cursor: pointer; font-size: 14px; color: #888; border-bottom: 2px solid transparent; }
  .tab.active { color: #a78bfa; border-bottom-color: #a78bfa; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  .event-list { font-family: monospace; font-size: 13px; }
  .event-item { padding: 8px 12px; border-bottom: 1px solid #1a1a2a; display: flex; gap: 12px; }
  .event-type { color: #93c5fd; min-width: 260px; }
  .event-time { color: #666; min-width: 180px; }
  .event-id { color: #555; }
  .projection-card { background: #16161f; border: 1px solid #2a2a3a; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
  .projection-card h3 { color: #a78bfa; font-size: 14px; margin-bottom: 8px; }
  .projection-card pre { background: #0a0a0f; padding: 12px; border-radius: 4px; font-size: 12px; overflow-x: auto; color: #ccc; }
  .policy-rule { background: #16161f; border: 1px solid #2a2a3a; border-radius: 6px; padding: 12px; margin-bottom: 8px; }
  .policy-rule .rule-id { color: #a78bfa; font-family: monospace; font-size: 13px; }
  .policy-rule .rule-decision { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-left: 8px; }
  .policy-rule .rule-decision.allowed { background: #064e3b; color: #6ee7b7; }
  .policy-rule .rule-decision.denied { background: #7f1d1d; color: #fca5a5; }
  .policy-rule .rule-decision.requires_approval { background: #3b3b0a; color: #fde68a; }
  .policy-rule .rule-desc { color: #888; font-size: 13px; margin-top: 4px; }
  .empty { color: #555; text-align: center; padding: 40px; font-size: 14px; }
</style>
</head>
<body>
<div class="header">
  <h1>◆ Prism Dashboard</h1>
  <span class="version">v0.11.0</span>
</div>
<nav class="nav">
  <a href="/index.html" class="active">Runs</a>
  <a href="/v2.html">Status</a>
  <a href="/scheduler.html">Cron Jobs</a>
  <a href="/config.html">Settings</a>
  <a href="/editor.html">Agent Graph</a>
  <a href="/workflow-editor.html">Workflow</a>
</nav>

<div class="container">
  <!-- Runs List View -->
  <div id="runs-view">
    <h2 style="margin-bottom:16px;">Runs</h2>
    <div id="runs-list" class="runs-grid"></div>
  </div>

  <!-- Run Detail View -->
  <div id="detail-view" class="detail">
    <div class="detail-header">
      <span class="back" onclick="showRuns()">← Back</span>
      <h2 id="detail-run-id"></h2>
    </div>
    <div class="tabs">
      <div class="tab active" data-tab="summary" onclick="switchTab('summary')">Summary</div>
      <div class="tab" data-tab="events" onclick="switchTab('events')">Events</div>
      <div class="tab" data-tab="projections" onclick="switchTab('projections')">Projections</div>
    </div>
    <div id="tab-summary" class="tab-content active"></div>
    <div id="tab-events" class="tab-content"></div>
    <div id="tab-projections" class="tab-content"></div>
  </div>
</div>

<script>
let currentRunId = null;

async function fetchJSON(url) {
  const r = await fetch(url);
  return r.json();
}

async function loadRuns() {
  const runs = await fetchJSON('/api/runs');
  const list = document.getElementById('runs-list');
  if (!runs.length) {
    list.innerHTML = '<div class="empty">No runs found</div>';
    return;
  }
  list.innerHTML = runs.map(r => `
    <div class="run-card" onclick="showRun('${r.run_id}')">
      <div class="run-id">${r.run_id}</div>
      <span class="run-status ${r.status}">${r.status}</span>
      <div class="task">${r.task || '(no task)'}</div>
      <div class="run-meta">${r.agent || ''} ${r.project ? '· ' + r.project : ''} ${r.started_at ? '· ' + r.started_at.slice(0,19).replace('T',' ') : ''}</div>
    </div>
  `).join('');
}

async function showRun(runId) {
  currentRunId = runId;
  document.getElementById('runs-view').style.display = 'none';
  document.getElementById('detail-view').classList.add('active');
  document.getElementById('detail-run-id').textContent = runId;
  switchTab('summary');
  loadSummary(runId);
}

function showRuns() {
  document.getElementById('runs-view').style.display = 'block';
  document.getElementById('detail-view').classList.remove('active');
  currentRunId = null;
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.toggle('active', t.id === 'tab-' + name));
  if (name === 'events' && currentRunId) loadEvents(currentRunId);
  if (name === 'projections' && currentRunId) loadProjections(currentRunId);
  if (name === 'summary' && currentRunId) loadSummary(currentRunId);
}

async function loadSummary(runId) {
  const detail = await fetchJSON('/api/runs/' + runId);
  const el = document.getElementById('tab-summary');
  const s = detail.summary || {};
  el.innerHTML = `
    <div class="projection-card">
      <h3>Run Summary</h3>
      <pre>${JSON.stringify(s, null, 2)}</pre>
    </div>
    <p style="color:#888;font-size:13px;margin-top:8px;">${detail.event_count || 0} events · ${(detail.projections || []).length} projections</p>
  `;
}

async function loadEvents(runId) {
  const events = await fetchJSON('/api/events/' + runId);
  const el = document.getElementById('tab-events');
  if (!events.length) {
    el.innerHTML = '<div class="empty">No events</div>';
    return;
  }
  el.innerHTML = '<div class="event-list">' + events.map(e => `
    <div class="event-item">
      <span class="event-type">${e.type}</span>
      <span class="event-time">${(e.timestamp || '').slice(0,23).replace('T',' ')}</span>
      <span class="event-id">${e.id || ''}</span>
    </div>
  `).join('') + '</div>';
}

async function loadProjections(runId) {
  const detail = await fetchJSON('/api/runs/' + runId);
  const el = document.getElementById('tab-projections');
  const names = detail.projections || [];
  if (!names.length) {
    el.innerHTML = '<div class="empty">No projections — run "prism projection rebuild --run ' + runId + '"</div>';
    return;
  }
  el.innerHTML = '';
  for (const name of names) {
    const proj = await fetchJSON('/api/projections/' + runId + '/' + name);
    const card = document.createElement('div');
    card.className = 'projection-card';
    card.innerHTML = `<h3>${name}</h3><pre>${JSON.stringify(proj, null, 2)}</pre>`;
    el.appendChild(card);
  }
}

loadRuns();
setInterval(loadRuns, 5000);
</script>
</body>
</html>
